name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# A newer push to the same branch/PR makes the running job pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEFAULT_PYTHON: "3.14"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip
          cache-dependency-path: custom_components/netro_watering/requirements.test.txt

      - name: Install ruff
        run: pip install "$(grep -E '^ruff==' custom_components/netro_watering/requirements.test.txt)"

      - name: ruff check
        run: ruff check --output-format=github custom_components tests

      - name: ruff format
        run: ruff format --check --diff custom_components tests

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip
          cache-dependency-path: custom_components/netro_watering/requirements.test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r custom_components/netro_watering/requirements.test.txt

      - name: Report the Home Assistant version under test
        run: python -c "from homeassistant.const import __version__ as v; print('Home Assistant', v)"

      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests -v \
            --cov=custom_components.netro_watering \
            --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: unittests
          name: codecov-umbrella
