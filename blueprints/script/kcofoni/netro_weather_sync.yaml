blueprint:
  name: Netro Weather Sync Script
  description: >
    Synchronizes weather data from a weather entity to a Netro controller.
    This script retrieves daily weather forecasts and transmits them to the controller
    to optimize watering schedules.
    For today, real-time station sensors (if configured) override the forecast values.
    Fields that cannot be determined (missing attribute, unavailable sensor) are
    simply not reported to Netro instead of sending made-up values.

  source_url: https://github.com/kcofoni/ha-netro-watering/blob/main/blueprints/script/kcofoni/netro_weather_sync.yaml

  domain: script

  input:
    netro_controller:
      name: Netro Controller
      description: Select the Netro controller config entry to synchronize
      selector:
        config_entry:
          integration: netro_watering

    weather_entity:
      name: Weather Entity
      description: Select the source weather entity (e.g. weather.stazione_meteocarpi)
      selector:
        entity:
          domain: weather

    rain_probability_entity:
      name: Rain Probability Entity (Optional)
      description: Sensor entity for rain probability if available
      default: ""
      selector:
        entity:
          domain: sensor

    rain_today_entity:
      name: Daily Rain Sensor (Optional)
      description: >
        Sensor for actual rainfall today in mm (e.g. sensor.pioggia_giornaliera).
        Overrides forecast precipitation for today's report.
      default: ""
      selector:
        entity:
          domain: sensor

    temp_min_entity:
      name: Daily Min Temperature Sensor (Optional)
      description: >
        Sensor for today's measured minimum temperature (e.g. sensor.temperatura_min_giornaliera).
        Overrides forecast templow for today's report.
      default: ""
      selector:
        entity:
          domain: sensor

    temp_max_entity:
      name: Daily Max Temperature Sensor (Optional)
      description: >
        Sensor for today's measured maximum temperature (e.g. sensor.temperatura_max_giornaliera).
        Overrides forecast temperature for today's report.
      default: ""
      selector:
        entity:
          domain: sensor

variables:
  weather_entity_id: !input weather_entity
  rain_prob_entity: !input rain_probability_entity
  rain_today_entity: !input rain_today_entity
  temp_min_entity: !input temp_min_entity
  temp_max_entity: !input temp_max_entity
  config_entry_controller: !input netro_controller

fields:
  number_of_days_forecast:
    name: Number of Forecast Days
    description: Number of forecast days to synchronize (in addition to today)
    required: true
    default: 4
    selector:
      number:
        min: 0
        max: 7
        mode: slider

sequence:
  - alias: "Get weather forecasts"
    action: weather.get_forecasts
    target:
      entity_id: "{{ weather_entity_id }}"
    data:
      type: daily
    response_variable: myforecasts

  - alias: "Stop if the weather entity returned no daily forecast"
    condition: template
    value_template: >
      {{ (myforecasts.get(weather_entity_id, {}).get('forecast') or []) | length > 0 }}

  - alias: "Shortcut variables"
    variables:
      forecast_list: "{{ myforecasts[weather_entity_id]['forecast'] }}"
      today_forecast: "{{ myforecasts[weather_entity_id]['forecast'][0] }}"

  - alias: "Sync today's weather (station data overrides forecasts)"
    action: netro_watering.report_weather
    data:
      config_entry_id: "{{ config_entry_controller }}"
      date: >
        {{ now().strftime("%Y-%m-%d") }}
      condition: >
        {% set mapped_conditions = {
          'clear-night': 'clear', 'cloudy': 'cloudy', 'exceptional': 'rain',
          'fog': 'cloudy', 'hail': 'rain', 'lightning': 'rain',
          'lightning-rainy': 'rain', 'partlycloudy': 'cloudy', 'pouring': 'rain',
          'rainy': 'rain', 'snowy': 'snow', 'snowy-rainy': 'snow',
          'sunny': 'clear', 'windy': 'wind', 'windy-variant': 'wind'
        } %}
        {{ mapped_conditions.get(states(weather_entity_id)) }}
      rain: >
        {% set forecast_rain = today_forecast.get('precipitation') | float(0) %}
        {% if rain_today_entity != "" and has_value(rain_today_entity) %}
          {% set sensor_rain = states(rain_today_entity) | float(0) %}
          {{ sensor_rain if (sensor_rain > forecast_rain or now().hour >= 20)
             else forecast_rain }}
        {% else %}
          {{ forecast_rain }}
        {% endif %}
      t_min: >
        {% set forecast_min = today_forecast.get('templow') %}
        {% set sensor_min = states(temp_min_entity) | float(none)
           if (temp_min_entity != "" and has_value(temp_min_entity)) else none %}
        {% if sensor_min is not none and (forecast_min is none
           or sensor_min < forecast_min or now().hour >= 10) %}
          {{ sensor_min }}
        {% else %}
          {{ forecast_min }}
        {% endif %}
      t_max: >
        {% set forecast_max = today_forecast.get('temperature') %}
        {% set sensor_max = states(temp_max_entity) | float(none)
           if (temp_max_entity != "" and has_value(temp_max_entity)) else none %}
        {% if sensor_max is not none and (forecast_max is none
           or sensor_max > forecast_max or now().hour >= 20) %}
          {{ sensor_max }}
        {% else %}
          {{ forecast_max }}
        {% endif %}
      humidity: >
        {{ state_attr(weather_entity_id, 'humidity') }}
      rain_prob: >
        {% if rain_prob_entity != "" and has_value(rain_prob_entity) %}
          {{ states(rain_prob_entity) | int(0) }}
        {% else %}
          {{ today_forecast.get('precipitation_probability') }}
        {% endif %}
      temp: >
        {% set forecast_min = today_forecast.get('templow') %}
        {% set sensor_min = states(temp_min_entity) | float(none)
           if (temp_min_entity != "" and has_value(temp_min_entity)) else none %}
        {% set final_min = sensor_min if (sensor_min is not none and (forecast_min is none
           or sensor_min < forecast_min or now().hour >= 10)) else forecast_min %}
        {% set forecast_max = today_forecast.get('temperature') %}
        {% set sensor_max = states(temp_max_entity) | float(none)
           if (temp_max_entity != "" and has_value(temp_max_entity)) else none %}
        {% set final_max = sensor_max if (sensor_max is not none and (forecast_max is none
           or sensor_max > forecast_max or now().hour >= 20)) else forecast_max %}
        {% if final_min is not none and final_max is not none %}
          {{ ((final_min + final_max) / 2) | round(1) }}
        {% else %}
          {{ none }}
        {% endif %}
      wind_speed: >
        {% set ws = state_attr(weather_entity_id, 'wind_speed') %}
        {% if ws is none %}
          {{ none }}
        {% else %}
          {% set ws = ws | float(0) %}
          {% set unit = state_attr(weather_entity_id, 'wind_speed_unit') | default('km/h', true) %}
          {% if unit == 'm/s' %}
            {{ ws | round(2) }}
          {% elif unit == 'mph' %}
            {{ (ws * 0.44704) | round(2) }}
          {% elif unit == 'ft/s' %}
            {{ (ws * 0.3048) | round(2) }}
          {% elif unit == 'kn' %}
            {{ (ws * 0.514444) | round(2) }}
          {% else %}
            {{ (ws / 3.6) | round(2) }}
          {% endif %}
        {% endif %}
      pressure: >
        {% set p = state_attr(weather_entity_id, 'pressure') %}
        {% if p is none %}
          {{ none }}
        {% else %}
          {% set p = p | float(0) %}
          {% set unit = state_attr(weather_entity_id, 'pressure_unit') | default('hPa', true) %}
          {% if unit in ['hPa', 'mbar'] %}
            {{ p | round(1) }}
          {% elif unit == 'inHg' %}
            {{ (p * 33.8639) | round(1) }}
          {% elif unit == 'mmHg' %}
            {{ (p * 1.33322) | round(1) }}
          {% elif unit == 'kPa' %}
            {{ (p * 10) | round(1) }}
          {% elif unit == 'psi' %}
            {{ (p * 68.9476) | round(1) }}
          {% else %}
            {{ p | round(1) }}
          {% endif %}
        {% endif %}
      t_dew: >
        {{ state_attr(weather_entity_id, 'dew_point') }}

  - alias: "Sync forecast days"
    repeat:
      count: "{{ [number_of_days_forecast | default(4), forecast_list | length - 1] | min }}"
      sequence:
        - variables:
            day_forecast: "{{ forecast_list[repeat.index] }}"
        - action: netro_watering.report_weather
          data:
            config_entry_id: "{{ config_entry_controller }}"
            date: >
              {{ as_timestamp(day_forecast.get('datetime'), now()) | timestamp_custom("%Y-%m-%d") }}
            condition: >
              {% set mapped_conditions = {
                'clear-night': 'clear', 'cloudy': 'cloudy', 'exceptional': 'rain',
                'fog': 'cloudy', 'hail': 'rain', 'lightning': 'rain',
                'lightning-rainy': 'rain', 'partlycloudy': 'cloudy', 'pouring': 'rain',
                'rainy': 'rain', 'snowy': 'snow', 'snowy-rainy': 'snow',
                'sunny': 'clear', 'windy': 'wind', 'windy-variant': 'wind'
              } %}
              {{ mapped_conditions.get(day_forecast.get('condition')) }}
            rain: >
              {{ day_forecast.get('precipitation') | float(none) }}
            t_min: >
              {{ day_forecast.get('templow') }}
            t_max: >
              {{ day_forecast.get('temperature') }}
            rain_prob: >
              {{ day_forecast.get('precipitation_probability') }}

mode: single
icon: mdi:cloud-arrow-down-outline
